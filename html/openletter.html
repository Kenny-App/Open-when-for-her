<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../assets/icon/favicon.svg" type="image/svg+xml" />
    <!-- PNG favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icon/favicon-32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icon/favicon-16.png"
    />

    <!-- Apple Home Screen icon -->
    <link rel="apple-touch-icon" href="../assets/icon/apple-touch-icon.png" />

    <title>Open when for her -</title>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-heart">♡</div>
      <p>Preparing your letter...</p>
    </div>
    <header>
      <a href="../index.html" class="disabled-default">
        <span class="back-button">&lt;</span>
      </a>
    </header>
    <main class="ol-main">
      <div class="open-letter">
        <img id="open-letter-img" src="" alt="open letter" />
      </div>
      <div>
        <p id="content-txt" class="open-letter-text"></p>
        <p class="heart-middle">♡</p>
      </div>
    </main>
    <footer style="margin-bottom: 10px">
      <p id="letter-last-word" class="last-word"></p>
    </footer>
  </body>

  <script src="../js/populateLetter.js"></script>
  <script>
    // Redirect to the game if the user is offline
    function checkConnection() {
      if (!navigator.onLine) {
        sessionStorage.previousPage = window.location.href;
        window.location.replace("../html/offline.html");
      }
    }

    // Check as soon as the page loads
    checkConnection();

    // Also check if the connection is lost while on the home page
    window.addEventListener("offline", checkConnection);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("../service-worker.js")
          .catch((error) => console.error("Service Worker error:", error));
      });
    }
  </script>
</html>
