<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Open when for her -</title>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-heart">♡</div>
      <p>Preparing your letter...</p>
    </div>
    <header>
      <a href="../index.html" class="disabled-default">
        <span class="back-button">&lt;</span>
      </a>
    </header>
    <main class="ol-main">
      <div class="open-letter">
        <img id="open-letter-img" src="" alt="open letter" />
      </div>
      <div>
        <p id="content-txt" class="open-letter-text"></p>
        <p class="heart-middle">♡</p>
      </div>
    </main>
    <footer>
      <p id="letter-last-word" class="last-word"></p>
    </footer>
  </body>

  <script src="../js/populateLetter.js"></script>
</html>
